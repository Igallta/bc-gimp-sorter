<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Misaka iPad Guard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0d151d; color: #dff6ff; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    .pulse { width: 2.5rem; height: 2.5rem; margin: 0 auto 1.25rem; border: 3px solid #72d6ff55; border-top-color: #72d6ff; border-radius: 50%; animation: spin 1s linear infinite; }
    p { color: #a9cadb; line-height: 1.6; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main><div class="pulse"></div><h1>正在释放 WebContent</h1><p id="status">即将返回 Bondage Club…</p></main>
  <script>
    (() => {
      "use strict";
      const ROOTS = [
        "bondageprojects.elementfx.com",
        "bondage-europe.com",
        "bondageprojects.com",
        "bondage-asia.com",
        "bondageclub.com",
      ];
      const status = document.getElementById("status");

      function isAllowedReturnUrl(value) {
        try {
          const url = new URL(value);
          const hostname = url.hostname.toLowerCase();
          const allowedHost = ROOTS.some((root) => hostname === root || hostname.endsWith(`.${root}`));
          const allowedProtocol = url.protocol === "https:" ||
            (url.protocol === "http:" && (hostname === "localhost" || hostname === "127.0.0.1"));
          const allowedPath = /^\/(?:club\/)?R[^/]+(?:\/|$)/i.test(url.pathname);
          return allowedHost && allowedProtocol && allowedPath && !url.username && !url.password;
        } catch (_) {
          return false;
        }
      }

      const params = new URLSearchParams(location.hash.slice(1));
      const returnUrl = params.get("return") || "";
      if (!isAllowedReturnUrl(returnUrl)) {
        status.textContent = "返回地址无效，已停止跳转。请手动打开 Bondage Club。";
        return;
      }
      history.replaceState(null, "", `${location.pathname}${location.search}`);
      setTimeout(() => location.replace(returnUrl), 4000);
    })();
  </script>
</body>
</html>
